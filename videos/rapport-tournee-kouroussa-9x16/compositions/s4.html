/* Rapport de la tournée des Députés de Kouroussa — shared film styles.

   Rule: body text >= 30 px on h, >= 34 px on v; captions 40 / 46 px. */
:root {
  --ivory: #F6F2E9;
  --ivory-2: #ECE5D5;
  --ivory-dim: #D9D2C1;
  --ink: #17261D;

  --green-deep: #003D1F;
  --green-ink: #00291A;
  --gold-1: #8B6914;

  --serif: "Playfair Display", Georgia, serif;

}

.rk { position: absolute; inset: 0; overflow: hidden; color: var(--ivory); font-family: var(--sans); }
.rk * { box-sizing: border-box; }
.rk .scene { position: absolute; inset: 0; overflow: hidden; }
.rk .fill { position: absolute; inset: 0; }
.rk .ivory { position: absolute; inset: 0; background: var(--ivory); }
.rk .ivory-sheen { position: absolute; inset: 0; pointer-events: none;

    radial-gradient(ellipse 50% 60% at 82% 88%, rgba(201, 164, 76, 0.22) 0%, rgba(201, 164, 76, 0) 70%),

.rk .sheen-band { position: absolute; top: -30%; bottom: -30%; width: 22%; left: -30%; pointer-events: none; mix-blend-mode: soft-light;

.rk .green-bg { position: absolute; inset: 0; background: radial-gradient(ellipse 90% 85% at 50% 40%, #0A4A2A 0%, var(--green-deep) 55%, var(--green-ink) 100%); }

/* photos: ratio kept (object-fit: cover), crop centred on the focus point given in object-position */
.rk .ph { position: absolute; overflow: hidden; }
.rk .ph > img, .rk .ph > video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.rk .scrim { position: absolute; inset: 0; pointer-events: none; }
.rk .frame-gold { border: 3px solid var(--gold-2); box-shadow: 0 0 0 1px rgba(139, 105, 20, 0.6), 0 18px 50px rgba(0, 20, 10, 0.45); border-radius: 6px; }

/* text on dark-green bands edged with gold */
.rk .band { position: relative; background: linear-gradient(180deg, rgba(0, 82, 41, 0.96) 0%, rgba(0, 61, 31, 0.96) 100%);

.rk .gold-rule { display: block; width: 110px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--gold-1), var(--gold-3), var(--gold-2)); }
