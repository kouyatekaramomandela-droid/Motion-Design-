/* FUTURA-Kouroussa — shared film styles (tokens from frame.md) */
:root {
  --night: #1A2A3A;
  --night-deep: #0F1A25;
  --night-raised: #22364A;
  --gold-deep: #B8860B;
  --gold: #F5C518;
  --gold-pale: #F8DF7A;
  --ivory: #F3EEE3;
  --ivory-dim: #A9B3BC;
  --flag-red: #CE1126;
  --flag-green: #009A44;
  --serif: "Playfair Display", Georgia, serif;
  --sans: "Montserrat", "Futura", sans-serif;
  --brand: "Roboto", "Helvetica Neue", sans-serif;
}

.fk { position: absolute; inset: 0; overflow: hidden; color: var(--ivory); font-family: var(--sans); }
.fk * { box-sizing: border-box; }
.fk .abs { position: absolute; }
.fk .bg { position: absolute; inset: 0; background: var(--night); }
.fk .glow { position: absolute; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(245, 197, 24, 0.30) 0%, rgba(184, 134, 11, 0.12) 38%, rgba(26, 42, 58, 0) 70%); }
.fk .vignette { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 75% 70% at 50% 45%, rgba(15, 26, 37, 0) 55%, rgba(15, 26, 37, 0.65) 100%); }
.fk .lattice { position: absolute; inset: 0; opacity: 0.10; pointer-events: none;
  background-image:
    linear-gradient(45deg, transparent 48.5%, var(--gold-deep) 49.5%, var(--gold-deep) 50.5%, transparent 51.5%),
    linear-gradient(-45deg, transparent 48.5%, var(--gold-deep) 49.5%, var(--gold-deep) 50.5%, transparent 51.5%);
  background-size: 120px 120px; }

/* type roles */
.fk .t-label { font-family: var(--sans); font-weight: 700; text-transform: uppercase; letter-spacing: 0.18em; font-size: 26px; color: var(--gold); }
.fk .t-label.dim { color: var(--ivory-dim); }
.fk .t-display { font-family: var(--serif); font-weight: 700; letter-spacing: -0.02em; line-height: 1.08; }
.fk .t-hero { font-family: var(--serif); font-weight: 900; letter-spacing: -0.03em; line-height: 0.95; color: var(--gold); font-variant-numeric: lining-nums; }
.fk .t-body { font-family: var(--sans); font-weight: 400; font-size: 40px; line-height: 1.35; color: var(--ivory); }
.fk .t-brand { font-family: var(--brand); font-weight: 700; letter-spacing: -0.005em; color: var(--ivory); }
.fk .t-brand-sub { font-family: var(--brand); font-weight: 400; color: var(--ivory-dim); line-height: 1.25; }
.fk .gold { color: var(--gold); }

/* illustration line style */
.fk .ill { overflow: visible; }
.fk .ill .ink { stroke: var(--ivory-dim); }
.fk .lit-state .ill .ink { stroke: var(--gold-pale); }
.fk .lit-state .ill .ink.accent { stroke: var(--gold); }
.fk .dry .lit { opacity: 0; }

/* badges */
.fk .badge { display: inline-flex; align-items: center; height: 64px; padding: 0 30px; border: 3px solid var(--gold);
  border-radius: 999px; font-family: var(--sans); font-weight: 700; font-size: 24px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--gold); background: rgba(26, 42, 58, 0.6); white-space: nowrap; }

/* captions (burned-in subtitles) */
.fk-caption { position: absolute; left: 96px; right: 96px; bottom: 54px; display: flex; justify-content: center; pointer-events: none; }
.fk-caption span { display: inline-block; max-width: 1500px; padding: 14px 30px 16px; border-radius: 12px; text-align: center;
  font-family: var(--sans); font-weight: 700; font-size: 40px; line-height: 1.3; color: var(--ivory);
  background: rgba(15, 26, 37, 0.72); text-wrap: balance; }
.v .fk-caption { left: 54px; right: 54px; bottom: auto; top: 1380px; }
.v .fk-caption span { max-width: 972px; font-size: 46px; }

/* format switches: one composition, two canvases */
.h .only-v, .v .only-h { display: none; }

#s4-root { position: absolute; inset: 0; overflow: hidden; }
</style>

<script>
(function () {
const FMT = "h", W = 1920, H = 1080, T0 = 41.4, DUR = 17.2, H_ = FMT === "h";
const root = document.querySelector('[data-composition-id="s4"]');
const $ = (s) => root.querySelector(s);
const $$ = (s) => Array.from(root.querySelectorAll(s));
const at = (g) => Math.max(0, Math.round((g - T0) * 1000) / 1000);
const pick = (h, v) => (H_ ? h : v);
const tl = gsap.timeline({ paused: true });
function prepDraw(els) {
  (Array.isArray(els) ? els : [els]).forEach((el) => {
    el.setAttribute("pathLength", "1");
    el.style.strokeDasharray = "1 1";
    el.style.strokeDashoffset = "1";
  });
}
function splitText(el, perChar, block) {
  const out = [];
  const walk = (node) => {
    Array.from(node.childNodes).forEach((n) => {
      if (n.nodeType === 3) {
        const frag = document.createDocumentFragment();
        n.textContent.split(/(\s+)/).forEach((p) => {
          if (!p) return;
          if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(p)); return; }
          const w = document.createElement("span");
          w.style.display = "inline-block"; w.style.whiteSpace = "nowrap";
          if (perChar) {
            Array.from(p).forEach((ch) => {
              const c = document.createElement("span");
              c.textContent = ch;
              if (block) c.style.display = "inline-block";
              w.appendChild(c); out.push(c);
            });
          } else { w.textContent = p; out.push(w); }
          frag.appendChild(w);
        });
        n.replaceWith(frag);
      } else if (n.nodeType === 1) walk(n);
    });
  };
  walk(el);
  return out;
}
const splitWords = (el) => splitText(el, false, true);
const splitChars = (el, block) => splitText(el, true, block);
// Scene 4 — Le socle légal (41.4–58.6). The book opens, the articles light up, the lines come back and converge.
tl.fromTo($(".s4 .lattice"), { opacity: 0 }, { opacity: 0.1, duration: 1.6 }, at(41.8));
tl.fromTo($(".s4-glow"), { opacity: 0 }, { opacity: 0.9, duration: 1.6 }, at(42.2));
const right = $(".page.right"), left = $(".page.left");
tl.fromTo(right, { x: pick(900, 700), opacity: 0 }, { x: 0, opacity: 1, duration: 1.3, ease: "power3.out" }, at(41.3));
tl.fromTo(left, { rotationY: -105, opacity: 0, transformOrigin: "100% 50%" }, { rotationY: 0, opacity: 1, duration: 1.4, ease: "power2.out", transformOrigin: "100% 50%", transformPerspective: 2200 }, at(42.3));
tl.fromTo($(".s4 .spine"), { opacity: 0 }, { opacity: 1, duration: 0.6 }, at(42.8));
tl.fromTo($$(".s4 .bars i"), { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.6, ease: "power2.out", stagger: 0.03, transformOrigin: "0% 50%" }, at(43.0));
tl.fromTo($(".s4 .page.left .t-label"), { opacity: 0 }, { opacity: 1, duration: 0.6 }, at(43.1));

function lightUp(block, g) {
  tl.fromTo(block, { backgroundColor: "rgba(245,197,24,0)", boxShadow: "0 0 0px rgba(245,197,24,0)" },
    { backgroundColor: "rgba(245,197,24,0.10)", boxShadow: "0 0 60px rgba(245,197,24,0.18)", duration: 1.0, ease: "sine.inOut" }, at(g));
}
const a130 = $(".art130"), a165 = $(".art165");
lightUp(a130, 44.3);
tl.fromTo(a130.querySelector(".art-title"), { opacity: 0.18 }, { opacity: 1, duration: 0.7 }, at(44.5));
tl.fromTo(a130.querySelector(".art-sub"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, at(45.0));
tl.fromTo(a130.querySelector(".art-pct"), { opacity: 0, scale: 0.7, transformOrigin: "0% 70%" }, { opacity: 1, scale: 1, duration: 0.8, ease: "back.out(1.8)", transformOrigin: "0% 70%" }, at(45.6));
tl.fromTo(a130.querySelector(".art-desc"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, at(46.0));
lightUp(a165, 47.6);
tl.fromTo(a165.querySelector(".art-title"), { opacity: 0.18 }, { opacity: 1, duration: 0.7 }, at(47.8));

// the gold lines turn back and converge on one point
const conv = $(".s4-converge.only-" + FMT);
const backs = Array.from(conv.querySelectorAll(".back"));
prepDraw(backs);
tl.fromTo(backs, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 2.6, ease: "power2.inOut", stagger: 0.3 }, at(49.8));
tl.fromTo(conv.querySelector(".focus"), { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 1.0, ease: "back.out(2)", transformOrigin: "50% 50%" }, at(52.8));
tl.fromTo(conv.querySelector(".focus-halo"), { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 0.25, duration: 1.2, ease: "power2.out", transformOrigin: "50% 50%" }, at(53.0));
tl.to(conv.querySelector(".focus"), { scale: 2.0, duration: 2.4, ease: "sine.inOut", transformOrigin: "50% 50%" }, at(54.2));
tl.to(conv.querySelector(".focus-halo"), { scale: 2.4, opacity: 0.4, duration: 2.4, ease: "sine.inOut", transformOrigin: "50% 50%" }, at(54.2));
tl.to($(".s4-book"), { opacity: 0.3, scale: 0.95, duration: 3.0, ease: "sine.inOut" }, at(52.0));
// exit: everything is drawn into the point (inhale 55.6–57.4)
tl.to($$(".s4-book, .s4 .lattice, .s4-glow"), { opacity: 0, duration: 1.0, ease: "power2.in" }, at(56.6));
tl.to(backs, { opacity: 0, duration: 0.8, ease: "power2.in" }, at(56.8));
tl.to(conv.querySelector(".focus-halo"), { scale: 0.6, opacity: 0, duration: 0.8, ease: "power2.in", transformOrigin: "50% 50%" }, at(57.0));
tl.to(conv.querySelector(".focus"), { scale: 1.2, duration: 0.6, ease: "power2.in", transformOrigin: "50% 50%" }, at(57.0));
tl.to(conv.querySelector(".focus"), { opacity: 0, duration: 0.3 }, at(58.0));

window.__timelines["s4"] = tl;
})();
</script>
