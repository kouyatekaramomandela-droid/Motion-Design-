<style>
  .s4 .s4-glow { width: 1300px; height: 1000px; left: 310px; top: -40px; }
  .s4 .s4-book { position: absolute; left: 380px; top: 100px; width: 1160px; height: 740px; perspective: 2400px; }
  .s4 .page { position: absolute; top: 0; width: 580px; height: 740px; padding: 54px 56px; background: var(--night-raised);
    border: 3px solid var(--gold-deep); }
  .s4 .page.left { left: 0; border-radius: 14px 0 0 14px; }
  .s4 .page.right { left: 580px; border-radius: 0 14px 14px 0; }
  .s4 .spine { position: absolute; left: 578px; top: 0; width: 4px; height: 740px; background: var(--gold-deep); }
  .s4 .bars i { display: block; height: 10px; margin: 0 0 20px; border-radius: 5px; background: rgba(169,179,188,.28); }
  .s4 .bars i:nth-child(3n) { width: 72%; } .s4 .bars i:nth-child(3n+1) { width: 94%; } .s4 .bars i:nth-child(3n+2) { width: 86%; }
  .s4 .page .t-label { margin-bottom: 38px; }
  .s4 .art { margin: 26px -24px; padding: 26px 24px 30px; border-radius: 12px; background: rgba(245,197,24,.10);
    box-shadow: 0 0 60px rgba(245,197,24,.18); }
  .s4 .art-title { font-size: 54px; color: var(--gold); }
  .s4 .art-sub { margin-top: 12px; font-weight: 700; font-size: 30px; line-height: 1.25; }
  .s4 .art-pct { margin-top: 18px; font-size: 168px; }
  .s4 .art-desc { margin-top: 6px; font-size: 32px; line-height: 1.3; }
  .s4 .art165 { margin-top: 40px; }
  .s4 svg.s4-converge { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .v .s4 .s4-glow { left: -110px; top: 260px; }
  .v .s4 .s4-book { left: 60px; top: 200px; width: 960px; height: 900px; }
  .v .s4 .page { width: 480px; height: 900px; padding: 40px 34px; }
  .v .s4 .page.right { left: 480px; }
  .v .s4 .spine { left: 478px; height: 900px; }
  .v .s4 .art { margin: 20px -14px; padding: 20px 14px 24px; }
  .v .s4 .art-title { font-size: 46px; }
  .v .s4 .art-sub { font-size: 27px; }
  .v .s4 .art-pct { font-size: 140px; }
  .v .s4 .art-desc { font-size: 28px; }
  .v .s4 svg.s4-converge { width: 1080px; height: 1920px; }
</style>
<div class="scene s4">
  <div class="bg"></div>
  <div class="lattice"></div>
  <div class="glow s4-glow"></div>
  <div class="s4-book">
    <div class="page left">
      <div class="t-label">Code minier</div>
      <div class="bars"><i></i><i></i><i></i></div>
      <div class="art art130">
        <div class="t-display art-title">Article 130</div>
        <div class="art-sub">Contribution au Développement Local</div>
        <div class="t-hero art-pct">1&#8239;%</div>
        <div class="art-desc">du chiffre d’affaires pour l’or</div>
      </div>
      <div class="bars"><i></i><i></i></div>
    </div>
    <div class="page right">
      <div class="bars"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="art art165"><div class="t-display art-title">Article 165</div></div>
      <div class="bars"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="spine"></div>
  </div>
  {{lines:s4}}
  <div class="vignette"></div>
</div>
